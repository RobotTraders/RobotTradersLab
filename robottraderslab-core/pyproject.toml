[project]
name = "robottraderslab-core"
version = "0.1.0"
description = "Base package of the RobotTradersLab trading surface"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "Robot Traders OÜ", email = "robot.traders@protonmail.com" }]
readme = "README.md"
keywords = ["trading", "algorithmic-trading", "cryptocurrency"]
dependencies = [
  "httpx>=0.27.0",
  "lazy-loader>=0.5",
  "numpy>=2.4.2",
  "pandas>=3.0.0",
  "pydantic-core>=2.41",
]

[project.urls]
Homepage = "https://robottraders.io/lab"
Repository = "https://github.com/RobotTraders/RobotTradersLab"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "bandit[toml]==1.9.4",
  "mypy==1.20.0",
  "pandas-stubs==3.0.0.260204",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
packages = ["robottraderslab_core"]
python_version = "3.13"
show_error_codes = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
namespace_packages = true
cache_dir = ".mypy_cache"
exclude = '^(build/|dist/|\.venv/|.*tests/)'

[tool.bandit]
skips = ["B101"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "PT", "TID251"]

[tool.ruff.lint.isort]
known-first-party = ["robottraderslab_core"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"robottraderslab._internal".msg = "Private module: import from the public API of robottraderslab."
