name: Core Checks
description: The checks every change to the core passes, run from the directory holding its pyproject.toml, which ships no lock, so the checks lock it first.

inputs:
  directory:
    description: The directory holding the core's pyproject.toml.
    required: false
    default: "."
  python-version:
    description: The Python version the checks run under.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Lock the core
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv lock

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv sync --locked

    - name: Run Formatter Check
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run ruff format --check

    - name: Run Linter
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run ruff check

    - name: Run Static Type Checking
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run mypy

    - name: Run Tests
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run pytest

    - name: Bandit Security Analysis
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run bandit -c pyproject.toml --recursive src --exclude tests
