name: Plugin Checks
description: The checks every change to a plugin passes, run from the directory holding its pyproject.toml, against the engine released on PyPI.

inputs:
  directory:
    description: The directory holding the plugin's pyproject.toml.
    required: false
    default: "."
  resolution:
    description: The uv resolution strategy, highest for the newest engine the plugin's range allows, lowest-direct for the lowest it declares.
    required: false
    default: highest
  python-version:
    description: The Python version the checks run under.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv sync --resolution ${{ inputs.resolution }}

    - name: Name the engine the checks run against
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        uv pip show robottraderslab
        source=$(awk '/^\[\[package\]\]/ { found = 0 } /^name = "robottraderslab"$/ { found = 1 } found && /^source = / { print; exit }' uv.lock)
        echo "uv.lock: $source"
        if [ "$source" != 'source = { registry = "https://pypi.org/simple" }' ]; then
          echo "The engine resolved from somewhere other than PyPI." >&2
          exit 1
        fi

    # --no-sync keeps the engine the sync resolved: a bare uv run resolves again at the default, newest, strategy.
    - name: Run Formatter Check
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run --no-sync ruff format --check

    - name: Run Linter
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run --no-sync ruff check

    - name: Run Static Type Checking
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run --no-sync mypy

    - name: Run Tests (with coverage)
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run --no-sync pytest --cov=src --cov-report=term

    - name: Bandit Security Analysis
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: uv run --no-sync bandit -c pyproject.toml --recursive src --exclude tests
