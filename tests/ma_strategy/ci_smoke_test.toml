[backtest]
initial_balance = { USDT = 10000.0 }
maker_fee_rate = 0.001
taker_fee_rate = 0.002
start_date = "2024-01-01"
end_date = "2025-01-01"

[backtest.ohlcv_provider]
ohlcv_provider = "mock"

[live.ohlcv_provider]
ohlcv_provider = "mock"
lookback = 100

[live.trading_account]
exchange = "simulator"
account_name = "account"
initial_balance = { USDT = 10000.0 }
maker_fee_rate = 0.001
taker_fee_rate = 0.002

[strategy]
strategy_class = "futures_ma"

[[strategy.profiles]]
symbol = "BTC/USDT:USDT"
timeframe = "1d"
available_balance_ratio = 0.25
fast_ma_length = 7
slow_ma_length = 20

[[strategy.profiles]]
symbol = "ETH/USDT:USDT"
timeframe = "1d"
available_balance_ratio = 0.25
fast_ma_length = 5
slow_ma_length = 15

[[strategy.profiles]]
symbol = "SOL/USDT:USDT"
timeframe = "4h"
available_balance_ratio = 0.25
fast_ma_length = 3
slow_ma_length = 7

[[strategy.profiles]]
symbol = "XRP/USDT:USDT"
timeframe = "4h"
